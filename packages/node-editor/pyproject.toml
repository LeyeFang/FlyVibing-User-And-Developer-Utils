[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyvibing-node-editor"
version = "0.1.1"
description = "Offline node-graph tool: experiment spec -> graph JSON -> .scene injection (+ sectioned rules reference)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 校验规则唯一实现在本包 `node_graph_validator.check_graph`（引擎 validation/checks.py 是薄适配器）。
# 校验需引擎源码的节点类型注册表 / 图约束 / 求值器在 PYTHONPATH 上（见 README「依赖与边界」）。
dependencies = []

[project.scripts]
flyvibing-node-editor = "flyvibing_node_editor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyvibing_node_editor"]
