[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyvibing-node-editor"
version = "0.1.0"
description = "Offline node-graph tool: experiment spec -> graph JSON -> .scene injection (+ sectioned rules reference)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 图校验实现**唯一**（引擎 Application.Core.NodeGraph.validation）；本工具是无头调用方。
# 因此独立安装后校验功能需要引擎源码在 PYTHONPATH 上（见 README「依赖与边界」）。
dependencies = []

[project.scripts]
flyvibing-node-editor = "flyvibing_node_editor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyvibing_node_editor"]
