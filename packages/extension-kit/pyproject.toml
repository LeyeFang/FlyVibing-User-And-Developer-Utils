[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyvibing-extension-kit"
version = "0.1.1"
description = "Extension author kit: static reviewer (M/C rules) + headless imgui test helper (ini-safe)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
flyvibing-review = "flyvibing_extension_kit.review_extension:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyvibing_extension_kit"]
